  HAM: 0.94  # Hamilton
  ALO: 0.92  # Alonso
  NOR: 0.88  # Norris
  LEC: 0.85  # Leclerc
  RUS: 0.84  # Russell
  PIA: 0.82  # Piastri
  SAI: 0.80  # Sainz

  # 2026 Experienced drivers
  HUL: 0.83  # Hulkenberg (veteran, good in wet)
  GAS: 0.81  # Gasly
  OCO: 0.78  # Ocon
  TSU: 0.76  # Tsunoda
  STR: 0.72  # Stroll
  ALB: 0.80  # Albon

  # 2026 Rookies/Young drivers (less proven in wet)
  ANT: 0.70  # Antonelli (rookie, potential unknown)
  BOR: 0.68  # Bortoleto (rookie)
  BEA: 0.72  # Bearman (limited experience)
  DOO: 0.70  # Doohan (rookie)
